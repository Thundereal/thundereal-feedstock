{% set name = "thundereal" %}
# Thundereal/ThunderealCAD's main: LinkVibe with the Thundereal branding merged.
# The THUNDEREAL_IDENTITY switch is left at its default (ON), which names the
# app org.thundereal.Thundereal.
{% set branch = "main" %}
# The program numbers itself by date, year.month.day: THUNDEREAL_IDENTITY in
# the source's cMake/FreeCAD_Helpers/InitializeFreeCADBuildOptions.cmake.
{% set version = "2026.10.15dev" %}

{% if qt is undefined %}
{% set qt = "6" %}
{% endif %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  git_url: https://github.com/Thundereal/ThunderealCAD.git
  git_rev: {{ branch }}
  git_depth: 1

build:
  number: 0
  string: py{{ CONDA_PY }}qt{{ qt }}h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}
  # Only 3.13 for this dev cycle, and this is what controls the rendered
  # matrix -- a python list in conda_build_config.yaml does NOT work,
  # because conda-smithy takes python from the global pinning and ignores
  # the recipe's. Keep it in step with pivy-feedstock, or one of the two
  # builds a python the other cannot resolve.
  #
  # A selector here is evaluated on the RAW text, before jinja removes a
  # branch. That is not a detail: the "skip: true # [py>311]" that used to
  # sit in the {% raw %}{% else %}{% endraw %} arm below applied to the qt6
  # build too, even though that arm is never emitted at qt 6, and had been
  # silently capping every build at python 3.11. It is why the checked-in
  # .ci_support claimed 3.10-3.13 while a fresh render produced 3.11 alone,
  # and why py311 is the only freecad-rt ever published. Removed with this
  # change; do not reintroduce a selector inside a jinja branch.
  skip: true  # [py != 313]
  script_env:
  {% if qt|int >= 6 %}
    - USE_QT6=1
  {% else %}
    - USE_QT6=0
  {% endif %}

requirements:
  run_constrained:
    - __osx >={{ MACOSX_DEPLOYMENT_TARGET|default("11.0") }}   # [osx and arm64]
    - __osx >={{ MACOSX_DEPLOYMENT_TARGET|default("10.13") }}  # [osx and x86_64]
  build:
    - {{ compiler("cxx") }}
    - {{ stdlib("c") }}
    - cmake
    # SWIG generation must match the one pivy-rt was built with, and version
    # is NOT a proxy for it. SWIG shares its type registry through a module
    # named swig_runtime_data<N> (swigpyrun.h); pivy registers Coin's types
    # into the module ITS swig named, FreeCAD looks them up in the module
    # OURS named, and two generations never meet. Nothing fails at build or
    # import time -- only a pointer crossing the boundary does, as
    # "RuntimeError: No SWIG wrapped library loaded", which kills every
    # createSWIGPointerObj site at once and so all Coin scripting. 4.2.x
    # emits generation 4, 4.5.x emits 5. Keep this in step with the swig pin
    # in pivy-feedstock; do not widen it as housekeeping.
    - swig >=4.5,<4.6
    - ninja
    - git
    - sed  # [unix]
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
  {% if qt|int >= 6 %}
    - qt6-main                               # [build_platform != target_platform]
  {% else %}
    - qt-main                                # [build_platform != target_platform]
  {% endif %}
    - pybind11                               # [build_platform != target_platform]
  host:
    - libboost-devel 1.90
    - python
  {% if qt|int >= 6 %}
    - qt6-main
  {% else %}
    - qt-main
  {% endif %}
    - occt 8.0.1
    - xerces-c
    - zlib
    - vtk 9.6.2
    # For vtk-io-ffmpeg, whose 9.6.2 builds take ffmpeg 8.1 or 9, never the
    # 7.0.1 this said before (the old freecad-rt recipe's, for vtk 9.2.6);
    # 9.0 as the dev env has it. Its run-export pins the run's ffmpeg, which
    # av below must match.
    - ffmpeg 9.0
    - eigen
    - pybind11
    - coin3d-rt
    - pivy-rt
  {% if qt|int >= 6 %}
    - pyside6
  {% else %}
    - pyside2
  {% endif %}
    - smesh
    # GL and X11 from conda-forge, the way the dev env has them. The CDTs that
    # stood in the build section are CentOS 7's and want sysroot 2.17, and
    # v8-embed below needs 2.28.
    - libgl-devel       # [linux]
    - libglx-devel      # [linux]
    - libegl-devel      # [linux]
    - libopengl-devel   # [linux]
    - xorg-libxdamage   # [linux]
    - xorg-libxfixes    # [linux]
    - xorg-libxxf86vm   # [linux]
    - xorg-libxext      # [linux]
    - xorg-libxau       # [linux]
    - xorg-libxi        # [linux]
    - libxcb            # [linux]
    # src/Mod/Area: find_package(libarea ... REQUIRED).
    - libarea
    # BUILD_EXPR_PYODIDE_HOST defaults to v8-embed being found: without it the
    # build goes green with no sandbox in it.
    - v8-embed
    # For the two things build.sh and bld.bat fetch: cogapp, a configure time
    # requirement conda-forge stops carrying at python 3.9, and the fcx-image
    # guest wheel, which is a wasm file and no conda package.
    - pip
    # src/Mod/BIM generates its SQL parser with this at build time; the run
    # entry below does not reach the host env.
    - lark
    - hdf5
    - libmed
    - libxml2-devel
    # Cycles (BUILD_CYCLES=ON). openexr and tbb are already pulled in
    # above via occt; these three are what the path tracer adds.
    - openimageio
    - embree
    - openimagedenoise
    - freetype
    - libspnav  # [linux]
    - pcl 1.15
    - six
    - ply
    - fmt ==12.1.0
    - matplotlib-base
    - xorg-xproto   # [linux]
    - yaml-cpp
    - tbb-devel
  run:
    - python
    - occt 8.0.1
  {% if qt|int >= 6 %}
    - pyside6
    # macOS links Qt's RHI headers (QRhi, QRhiTexture, the native-handle
    # structs) for the renderer's device-adoption path. Those are private API:
    # qrhi.h states it may make code source AND binary incompatible with future
    # Qt releases. qt6-main's own run-export is ">=<built version>,<7.0a0",
    # which is correct for public Qt and far too loose here -- it would let a
    # package built against 6.11.1 run against 6.12, where a moved struct
    # layout fails silently under already-compiled code rather than as a
    # missing symbol. Pin to the patch release this package was actually built
    # against. The bundle image is safe without this because it carries its own
    # Qt; this is for the package installed into someone else's environment.
    - {{ pin_compatible('qt6-main', max_pin='x.x.x') }}  # [osx]
  {% else %}
    - pyside2
  {% endif %}
    - vtk 9.6.2
    - coin3d-rt
    - pivy-rt
    - numpy
    - six
    - future
    - pyyaml
    - mcp  # runtime dependency of the freecad.mcp_console debug server
    - libspnav  # [linux]
    - {{ pin_compatible('smesh', max_pin='x.x.x') }}
    - ply
    - lark
    # gmsh runs out of process and so may bring the channel's occt, as this
    # package does. CalculiX has no occt dependency at all.
    - gmsh
    - calculix
    - libarea
    - v8-embed
    # BIM's IFC paths: the package links libarea and the fork's occt.
    - ifcopenshell
    # src/Ext/freecad/deprecation.py: Draft, Arch and importDXF import none
    # of themselves without it.
    - typing_extensions
    # Addon Manager, and BIM's site import.
    - requests
    - defusedxml
    - gitpython
    - pyshp
    # The Assembly simulation's animation export (CommandCreateSimulation.py):
    # the frames through Pillow, a GIF by it alone, MP4 and AVI through PyAV
    # (av) on the ffmpeg above -- conda-forge builds av against one ffmpeg
    # minor at a time, and the solver picks the av that matches.
    - pillow
    - av

# test:
#   commands:
#     # - ThunderealCmd -t 0
#     - ThunderealCmd --version || true # [unix and build_platform == target_platform]

about:
  home: https://thundereal.org
  dev_url: https://github.com/Thundereal/ThunderealCAD
  license: LGPL-2.1-or-later
  license_family: LGPL
  license_file: LICENSE
  summary: 'Thundereal CAD, a parametric 3D modeler forked from FreeCAD'
  description: |
    Thundereal CAD, a fork of FreeCAD grown out of the Link branch, with
    its own app id and artwork.

extra:
  recipe-maintainers:
    - realthunder
